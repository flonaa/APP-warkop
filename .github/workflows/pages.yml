name: Deploy ke GitHub Pages

# Situs statis: folder warkop-pos dipublikasikan apa adanya, tanpa build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Siapkan demo publik dengan data contoh
        run: |
          mkdir -p pages/demo
          cp -a warkop-pos/. pages/
          cp -a warkop-pos/. pages/demo/
          printf '%s\n' 'window.WARKOP_CONFIG = { DEMO: true };' > pages/demo/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
